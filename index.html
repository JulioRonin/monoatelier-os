<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mono Atelier OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* La app toma Tailwind de un CDN en tiempo de ejecución. Si la red lo
       bloquea (proxy corporativo, VPN, extensión), la página se dibuja SIN
       estilos: los botones se salen, el texto se corta y parece un bug de
       layout. Es un problema de red. Que lo diga en lugar de disimularlo. */
    window.addEventListener('DOMContentLoaded', function () {
      if (window.tailwind) return;
      var b = document.createElement('div');
      b.setAttribute('role', 'alert');
      b.style.cssText = 'position:fixed;inset:0 0 auto 0;z-index:99999;background:#7f1d1d;' +
        'color:#fff;padding:14px 18px;font:14px/1.5 system-ui,sans-serif';
      b.innerHTML = '<b>Los estilos no cargaron.</b> La página se está viendo sin formato ' +
        '(botones fuera de lugar, texto cortado): tu red bloqueó ' +
        '<code>cdn.tailwindcss.com</code>. No es un error de la aplicación — ' +
        'revisa proxy, VPN o extensiones del navegador.';
      document.body.appendChild(b);
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "#427a6e",
            "brand-bg": "#dfeee9",
            secondary: "#93d5df",
            surface: "#ffffff",
            "surface-dark": "#F2F0EB",
            accent: "#c44ebe",
            danger: "#991B1B",
            success: "#a2e4cf",
            "surface-dark": "#1f2937",
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
            mono: ['Space Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {

      scrollbar-width: none;

  </style>
