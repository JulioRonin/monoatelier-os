[project]
name = "mono-forge"
version = "0.1.0"
description = "Motor de diseño paramétrico de muebles — Mono Atelier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
docs = ["openpyxl>=3.1", "weasyprint>=62", "jinja2>=3.1"]
dev  = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
