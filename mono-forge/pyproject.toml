[project]
name = "mono-forge"
version = "0.1.0"
description = "Motor de diseño paramétrico de muebles — Mono Atelier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# reportlab en vez de weasyprint: instala con wheel en Windows, sin GTK ni
# dependencias del sistema. openpyxl para los xlsx del taller.
docs = ["openpyxl>=3.1", "reportlab>=4.0"]
dev  = ["pytest>=8.0", "openpyxl>=3.1", "reportlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
